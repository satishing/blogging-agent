repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
      - id: pylint
        name: pylint
        entry: uv run pylint -E --disable=no-member,invalid-sequence-index
        language: system
        types: [python]
